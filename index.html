.cd.ok{background:#D7F5E1}

#pt{display:inline-block;font-size:78px}
#ut{position:absolute;right:28%;top:12%;font-size:38px}

.tray{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.tl{font-size:30px;width:58px;height:58px;border-radius:14px;border:3px solid #BDE9DE;background:#F2FBF8;cursor:pointer;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tl.used{background:#D7F5E1;border-color:#4CB56F}
.fl{position:fixed;font-size:46px;pointer-events:none;transform:translate(-50%,-50%);z-index:99}
.go:disabled{opacity:.5;cursor:not-allowed}
#gd{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(59,42,74,.6);border-radius:18px;padding:8px;overflow:auto}
#t{z-index:9;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#3B2A4A;color:#fff;padding:6px 14px;border-radius:14px;font-size:.9rem;pointer-events:none;white-space:nowrap}
.help{font-size:.85rem;text-align:center;margin:8px 0 0}
.dk{background:#2B2236;color:#fff}
.dk .info{background:#3D3150}
.nm{width:100%;font:inherit;padding:8px 10px;border:3px solid #BDE9DE;border-radius:12px;color:var(--ink)}

.hud{background:linear-gradient(135deg,#4A2C6B,#7B3F8F);color:#fff;border-radius:18px;box-shadow:0 4px 0 #2F1A45,0 10px 24px rgba(74,44,107,.25)}

.tb{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);color:#fff}

.dk h3{color:#fff}

.info{background:linear-gradient(#FFF3F8,#FFEAF2);border:2px solid #F9D2E0;border-radius:14px}

.hero{text-align:center;padding:4px 0}
.logo{font-size:2.6rem}

.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}

.box.dk{background:#2B2236;color:#fff}

</style>

/* ---------- Atención ---------- */
function act(p){
  if(modal||over)return;
  if(p.st=="wait"){const r=p.c.room;
    if(bed[r]){toast("La "+ROOM[r]+" está ocupada");return}
    bed[r]=p;p.st="bed";LS.set("me_tut",1);p.x=BED[r].x;p.y=BED[r].y-5;ok();toast(p.n+" admitida en "+ROOM[r]+" ✔");
  }else if(p.st=="bed")open(p);
}

    const b=document.createElement("button");b.className="o ch";b.innerHTML='<span class="lt">'+(ix+1)+'</span><span>'+esc(it.t)+'</span>';b.ok=it.ok;
    b.onclick=()=>{
      if(it.ok){ok();if($("mf")){$("mf").textContent="🙂";say("Gracias, ya me siento mejor")}[...$("ol").children].forEach(x=>x.disabled=true);$("hb").innerHTML="";b.classList.add("ok");$("fb").className="fb fok";$("fb").innerHTML='✅ '+fbt+'<button class="go" id="nx">Continuar</button>';$("nx").onclick=next}
      else{no();b.disabled=true;b.classList.add("bad");brk();p.m++;if(p.m>=MAXM)fail(p);else{face();say("¿Está segura, obstetra?");$("fb").className="fb fno";$("fb").textContent="❌ "+((why&&why[it.t])||(ex?"No encaja con tus hallazgos ⚠️.":"Esa no es."))+" Te quedan "+(MAXM-p.m)+" intentos."}}

function trat(p){ST=4;
  modal=true;const L=[],IC=shuffle(["💊","💉","🌿"]),O=p.c.t.map((t,i)=>({t,w:p.c.w[i],e:IC[i]})),res='<div class="info">'+p.e+' <b>'+p.n+'</b> · '+p.c.n+'<br><small>'+p.c.cond+'</small></div>';

  const test=o=>{
    const good=o.t===p.c.t[0],pt=$("pt"),u=$("ut");
    L.push((good?"✅ ":"⚠️ ")+o.e+" <b>"+o.t+":</b> "+o.w);$("cl").innerHTML=L.join("<br>");$("dg").disabled=L.length<2;
    pt.className="";void pt.offsetWidth;pt.className=good?"hp":"sh";
    u.textContent=good?"😌✨":"😖";u.className="";void u.offsetWidth;u.className="uz";

  };
  shuffle(O).forEach(o=>{
    const b=document.createElement("button");b.className="tl";b.textContent=o.e;b.setAttribute("aria-label","Tratamiento");
    b.onpointerdown=ev=>{
      if(b.classList.contains("used"))return;
      ev.preventDefault();const f=document.createElement("div");f.className="fl";f.textContent=o.e;document.body.appendChild(f);
      const mv=x=>{f.style.left=x.clientX+"px";f.style.top=x.clientY+"px"};mv(ev);
      const up=x=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);f.remove();
        const el=$("pt");if(!el)return;const r=el.getBoundingClientRect();
        if((x.clientX>r.left-25&&x.clientX<r.right+25&&x.clientY>r.top-25&&x.clientY<r.bottom+25)||Math.hypot(x.clientX-ev.clientX,x.clientY-ev.clientY)<8){b.classList.add("used");test(o)}};

}

  $("hit").onclick=()=>{if(Math.abs(pos-c)<z/2){h++;$("hp").textContent=h;snd(700+h*100,.1,"square",.05);if(h>=3)good();else setZ()}else bad()};

function g2(good,bad){
  const E=["💉","🩺","🍼","🧪"].slice(0,lvl>2?4:3),d=shuffle(E.concat(E)),mx=7-lvl;let fl=[],lock=0,pr=0,ms=0;

function g3(good,bad,p){

      addEventListener("pointermove",mv);addEventListener("pointerup",up);

/* ---------- Resultados ---------- */
function startTreat(p){
  hideBox();modal=true;p.st="treat";p.tp=0;TR={p,t:0,d:2.5};toast("💊 Aplicando tratamiento a "+p.n+"…");snd(440,.15,"triangle",.07);
}
function leave(p){cur=null;ST=0;if(bed[p.c.room]===p)bed[p.c.room]=null;pats=pats.filter(x=>x!==p);done++;hud()}
function win(p){
  combo++;bestCombo=Math.max(bestCombo,combo);
  const s=Math.max(1,3-p.m),mult=1+Math.min(combo-1,5)*.25,gain=Math.round((25*s+10*lvl)*mult),pts=Math.round((100*s+50*lvl)*mult*DS[dif]);coins+=gain;score+=pts;cured++;
  parts.push({s:"+"+pts+" pts",x:p.x,y:p.y-60,l:1.8,c:"#2E8B57",z:22});if(combo>1)parts.push({s:"🔥 x"+combo,x:p.x,y:p.y-85,l:1.8,c:"#E8590C",z:20});
  award("first");if(combo>=3)award("c3");if(combo>=5)award("c5");if(coins>=500)award("rich");T=Math.min(T0,T+5*s);LRN.push("<b>"+p.c.n+":</b> "+p.c.tf);
  for(let i=0;i<9;i++)parts.push({e:["⭐","💖","✨"][i%3],x:p.x+(Math.random()-.5)*90,y:p.y-10,l:1.6});
  leave(p);
  showBox('<h3>🎉 ¡Paciente recuperada!</h3><p>'+p.e+' '+p.n+' vuelve a casa feliz.<br>'+"⭐".repeat(s)+' +'+gain+' 🪙 · +'+5*s+' s ⏱️<br>🏆 +'+pts+' pts'+(combo>1?'<br>🔥 Racha x'+combo+' (bonus +'+Math.round((mult-1)*100)+'%)':'')+'</p><div class="info">📚 <b>Lo aprendido:</b> '+p.c.df+' '+p.c.tf+'</div><button class="go" id="nx">Seguir</button>');
  $("nx").onclick=()=>{hideBox();modal=false;check()};
}
function fail(p){
  addMiss(p);loseHeart();leave(p);if(p.c.l>=3){grief(p,"los errores en su atención");return}
  showBox('<h3>🚑 Hay que derivarla</h3><p>Demasiados errores. Era <b>'+p.c.d[0]+'</b>. La conducta correcta:<br><b>'+p.c.t[0]+'</b></p><div class="info">📚 '+p.c.tf+'</div><button class="go" id="nx">Seguir</button>');
  $("nx").onclick=()=>{hideBox();modal=false;check()};
}

function timeUp(){clr();over=true;modal=true;lmsg="⏰ ¡Se acabó el tiempo en el nivel "+lvl+"! Se desató el caos en la sala.";lose()}
function fx(){
  const p=panic,a=p*(.55+.45*Math.sin(tm*(3+p*9))),c="rgba(230,30,30,"+a+")";
  cv.style.transform=shake>0?"translateX("+Math.sin(tm*90)*7*shake+"px)":"";
  cv.style.borderColor=p>0?"rgb(255,"+Math.round(255-190*a)+","+Math.round(255-190*a)+")":"";
  cv.style.boxShadow=p>0?"0 0 "+(10+30*a)+"px "+(3+8*a)+"px "+c:"";
  $("m").style.boxShadow=p>0?"inset 0 0 "+(30+70*p)+"px "+(5+20*p)+"px "+c:"";
}
function tmr(){const n=Math.ceil(T),t="⏱️ "+Math.floor(n/60)+":"+String(n%60).padStart(2,"0"),e=$("tk");if(e.textContent!=t)e.textContent=t;e.style.color=panic>.3?"#FFD166":""}
/* ---------- Bucle ---------- */
function upd(dt){
  tm+=dt;shake=Math.max(0,shake-dt);hush=Math.max(0,hush-dt);parts=parts.filter(q=>(q.l-=dt)>0);parts.forEach(q=>q.y-=45*dt);
  if(!over&&!inShop){T-=dt;if(T<=0){T=0;timeUp();return}}
  panic=over?0:Math.max(0,Math.min(1,(.4-T/T0)/.4));
  if(TR&&!over){TR.t+=dt;TR.p.tp=Math.min(1,TR.t/TR.d);if(TR.t>=TR.d){const p=TR.p;TR=null;win(p)}}
  if(modal||over)return;
  if(freeze>0)freeze-=dt;
  spT-=dt;
  if(spT<=0&&nxt<Q.length){
    const fr=[0,1,2].filter(i=>!pats.some(q=>q.st=="wait"&&q.sp==i));
    if(fr.length){const i=fr[0],a=AS[nxt%AS.length];pats.push({c:Q[nxt],i:nxt,e:/posparto|puerperal/i.test(Q[nxt].n)?a[2]:a[0],n:a[1],st:"wait",sp:i,x:SP[i].x,y:SP[i].y,pat:100,m:0});nxt++;if(lvl==1&&nxt==1&&!LS.get("me_tut",0))toast("❗ Llegó una paciente: acércate y presiona E, o tócala");spT=Math.max(7,15-lvl*1.5)}else spT=2;
  }
  const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),sp=180*(1+.25*perm.shoes);
  if(dx||dy){P.tg=null;const l=Math.hypot(dx,dy);P.x+=dx/l*sp*dt;P.y+=dy/l*sp*dt}
  else if(P.tg){const ex=P.tg.x-P.x,ey=P.tg.y-P.y,d=Math.hypot(ex,ey);
    if(d<(P.tg.p?50:6)){const p=P.tg.p;P.tg=null;if(p)act(p)}else{P.x+=ex/d*sp*dt;P.y+=ey/d*sp*dt}}
  P.x=Math.max(25,Math.min(775,P.x));P.y=Math.max(95,Math.min(435,P.y));
  if(freeze<=0)pats.filter(q=>q.st=="wait").forEach(q=>{
    q.pat-=dt*1.6*DP[dif]*(1+.2*(lvl-1))*(q.c.l>=3?1.3:1)*(perm.calm?.7:1);
    if(q.pat<=0&&!over&&!modal){addMiss(q);loseHeart();if(q.c.l>=3){leave(q);grief(q,"esperar sin que nadie la atendiera");return}pats=pats.filter(x=>x!==q);done++;hud();no();toast(q.n+" se cansó de esperar 🕒");check()}
  });
}

/* ---------- Dibujo ---------- */
function rr(x,y,w,h,r,f,s){g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.lineWidth=3;g.stroke()}}
function em(t,x,y,s){g.font=s+"px "+EM;g.textAlign="center";g.textBaseline="middle";g.fillStyle="#000";g.fillText(t,x,y)}
function txt(t,x,y,s,c){g.font="bold "+s+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillStyle=c;g.fillText(t,x,y)}
function draw(){
  g.setTransform(SC,0,0,SC,0,0);
  const cols=["#FFE6EE","#DDF4EE","#E6ECFB"],xs=[0,260,530],ws=[260,270,270];
  for(let r=0;r<3;r++){g.fillStyle=cols[r];g.fillRect(xs[r],60,ws[r],400);
    g.fillStyle="rgba(255,255,255,.55)";
    for(let i=0;i<ws[r]/40;i++)for(let j=0;j<10;j++)if((i+j)%2==0)g.fillRect(xs[r]+i*40,60+j*40,40,40)}
  const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,"#FFD6E4");gr.addColorStop(.5,"#FFF3F7");gr.addColorStop(1,"#CDEFE6");
  g.fillStyle=gr;g.fillRect(0,0,W,60);rr(0,52,W,8,0,"#F3C6D3");
  txt("🏥 Recepción",130,30,18,"#3B2A4A");txt("🩺 Consultorio",395,30,18,"#3B2A4A");txt("👶 Sala de partos",665,30,18,"#3B2A4A");
  g.fillStyle="#F3C6D3";[260,530].forEach(x=>{g.fillRect(x-4,60,8,130);g.fillRect(x-4,330,8,130)});
  [130,395,665].forEach(x=>{rr(x-22,66,44,26,8,"#CDEBFF","#fff");em("☁️",x,79,16)});
  rr(150,160,26,190,10,"#FFB3C6","#fff");em("🖥️",163,200,22);em("📋",163,260,20);
  SP.forEach(s=>rr(s.x-32,s.y+22,64,16,8,"#CDB4DB"));
  BED.forEach((b,i)=>{rr(b.x-58,b.y-14,116,66,14,"#fff","#C9B6E0");rr(b.x-52,b.y-8,32,26,10,"#FFC8DD");const oc=bed[i];em(oc?"💓":(i?"📈":"🧪"),b.x,b.y-60,oc?30+Math.sin(tm*8)*4:30)});
  [[40,435],[775,435],[285,435],[505,435],[555,435]].forEach(([x,y])=>em("🪴",x,y,28));
  em("🌷",230,110,22);em("🧸",30,110,26);em("🎀",300,110,20);em("🧸",760,110,22);
  if(P&&P.tg&&!P.tg.p){g.strokeStyle="#FF8FAB";g.lineWidth=3;g.beginPath();g.arc(P.tg.x,P.tg.y,10+Math.sin(tm*8)*2,0,7);g.stroke()}
  if(!P)return;
  const list=[...pats.map(p=>({y:p.y,f:()=>drawPat(p)})),{y:P.y,f:drawPlayer}].sort((a,b)=>a.y-b.y);
  list.forEach(o=>o.f());
  parts.forEach(q=>{g.globalAlpha=Math.min(1,q.l);if(q.s)txt(q.s,q.x,q.y,q.z||18,q.c||"#2E8B57");else em(q.e,q.x,q.y,24)});g.globalAlpha=1;
  if(freeze>0){g.fillStyle="rgba(120,180,255,.12)";g.fillRect(0,60,W,400);txt("⏳ "+Math.ceil(freeze)+" s",W/2,80,16,"#3B2A4A")}
  {const vg=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,W*.75);vg.addColorStop(0,"rgba(60,30,80,0)");vg.addColorStop(1,"rgba(60,30,80,.16)");g.fillStyle=vg;g.fillRect(0,0,W,H)}
  if(panic>0){const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.62),a=panic*(.55+.45*Math.sin(tm*(3+panic*9)));v.addColorStop(0,"rgba(255,0,0,0)");v.addColorStop(1,"rgba(220,20,20,"+.55*a+")");g.fillStyle=v;g.fillRect(0,0,W,H)}
}
function drawPat(p){
  const bob=Math.sin(tm*4+p.i)*2;
  g.fillStyle="rgba(0,0,0,.12)";g.beginPath();g.ellipse(p.x,p.y+24,22,7,0,0,7);g.fill();
  em(p.e,p.x,p.y+bob,44);
  txt(p.n,p.x,p.y+34,12,"#3B2A4A");
  rr(p.x-16,p.y-52+bob,32,24,10,"#fff",p.c.l>=3?"#E66":"#FF8FAB");em(p.st=="wait"?(p.c.l>=3?"🚨":"❗"):"🩺",p.x,p.y-40+bob,16);
  if(p.st=="treat"){
    const w=70,x=p.x-w/2,y=p.y-74+bob;
    txt("💊 Tratando…",p.x,y-11,12,"#3B2A4A");
    rr(x,y,w,10,5,"#E3EDE6","#fff");rr(x,y,Math.max(8,w*p.tp),10,5,"#4CB56F");
  }
  if(p.st=="wait"){rr(p.x-24,p.y+44,48,6,3,"#E8D6DE");rr(p.x-24,p.y+44,48*Math.max(0,p.pat/100),6,3,p.pat>30?"#6BCB77":"#FF6B6B")}
}
function drawPlayer(){
  const bob=Math.sin(tm*6)*(P.tg||keys.w||keys.a||keys.s||keys.d?2:0.5);
  g.fillStyle="rgba(0,0,0,.12)";g.beginPath();g.ellipse(P.x,P.y+24,24,7,0,0,7);g.fill();
  em("👩🏽‍⚕️",P.x+(panic>.3?Math.sin(tm*40)*2*panic:0),P.y+bob,46);
  if(panic>.5)em("😱",P.x+26,P.y-26+bob,22);
}

/* ---------- Entrada ---------- */
cv.addEventListener("click",e=>{
  if(modal||over)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const p=pats.find(q=>Math.hypot(q.x-x,q.y-y)<40);
  P.tg=p?{x:p.x,y:p.y+40,p}:{x,y};
});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(k=="e"&&!modal&&!over){const p=pats.find(q=>Math.hypot(q.x-P.x,q.y-P.y)<80);if(p)act(p)}
  if(k=="t")useTime();
  if(modal&&/^[1-4]$/.test(k)){const bb=[...document.querySelectorAll("#ol .o.ch")][+k-1];if(bb&&!bb.disabled)bb.click()}
  if(k.startsWith("arrow")&&!modal)e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
$("bs").onclick=()=>{if(!modal&&!over)shop(()=>{hideBox();modal=false})};
$("bt").onclick=useTime;
$("bg").onclick=()=>{if(!over&&$("gd").classList.contains("hide"))guide()};
$("bm").onclick=()=>{mute=!mute;$("bm").textContent=mute?"🔇":"🎵";if(!mute)music()};
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();fx();tmr();requestAnimationFrame(loop)}
function fit(){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,sc=Math.min(6,Math.max(1.5,d*r.width/W)),nw=Math.round(W*sc),nh=Math.round(H*sc);
  if(cv.width!=nw||cv.height!=nh){SC=sc;cv.width=nw;cv.height=nh}
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";
}
fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);addEventListener("resize",fit);
if(window.visualViewport)visualViewport.addEventListener("resize",fit);
hud();intro();requestAnimationFrame(loop);
</script>
